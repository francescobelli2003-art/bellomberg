title: ""
body:
  - type: markdown
    attributes:
      value: |
        Ask about installation, configuration or interpreting the application.
        Read the handbook first. Never attach a database, credentials, portfolio,
        mandate or research history. Reproduce with synthetic examples.
  - type: input
    id: version
    attributes:
      label: Version and operating system
      description: Include the source version or commit, OS, Python and Node versions.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question and expected result
      description: Include the page name or F-number and the relevant steps.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you checked
      description: Name the guide section and provide only sanitized error text.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I removed private data and credentials from this post and its attachments.
          required: true
