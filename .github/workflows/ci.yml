# CI Bellomberg (§9-bis n.7, piano ok PM 21/07):
#   1) compile-check del package src/bellomberg, launcher e strumenti pubblici;
#      archivio privato e directory runtime esclusi;
#   2) suite research OFFLINE esplicita, senza generazione Excel (zero rete/API/DB vivo:
#      la ANTHROPIC_API_KEY qui e' un dummy dichiarato, mai una chiave vera).
# NB: in locale il progetto gira su Python 3.14; il job Linux prova 3.12 (copertura dei
# wheel binari chromadb/arch/scipy) E 3.14 (matrice, 12/09); il job macOS resta su 3.12
# — differenza DICHIARATA, non tacita.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 12/09: a comando, per il job macos-source sul repo PRIVATO (vedi la sua condizione `if`)
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # 06/10 (PM): sul privato i minuti Actions sono a pagamento oltre i 2000 gratuiti: qui gira solo a
    # comando; sul pubblico (gratis) a ogni push e PR, come prima.
    if: ${{ github.event.repository.private == false || github.event_name == 'workflow_dispatch' }}
    # 12/09 (mandato Fable, sez. 4): 3.12 per la copertura dei wheel binari (chromadb/arch/
    # scipy) E 3.14, la versione con cui il PM lavora davvero (3.14.5). Matrice dichiarata.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      ANTHROPIC_API_KEY: dummy-ci-offline
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Compile package and operational tools
        run: >
          python -m compileall -q src/bellomberg tools/ops tools/migrations
          bellomberg_api.py consigliere_multi.py price_updater.py
          briefing_engine.py regenerate_memo.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The Python integration suite also exercises the real React valuation UI.
      - name: Frontend dependencies for integration tests
        working-directory: app
        run: npm ci

      - name: Suite offline
        run: python -I tools/testing/research_ci.py

      - name: Frontend TypeScript
        working-directory: app
        run: |
          npx tsc --noEmit

      - name: Frontend release contracts and production bundles
        working-directory: app
        run: |
          npm run test:release
          npm run build:bundles

      - name: Contratti puri mandato
        working-directory: app
        run: |
          npx tsc -p tests/mandato/tsconfig.json
          node tests/mandato/.tmp/tests/mandato/contratti.mjs

      # 05/09 (voce 7, criterio (4) del PM): il cancello PARZIALE anche in CI — vietate, esclusi,
      # dimensione sul perimetro dell'allowlist. Senza DB, senza .env e senza gitleaks (il download
      # pinnato e' il solo .exe): lo script lo DICHIARA riga per riga. Gira solo dove esistono le
      # liste private (il repo di lavoro): nel repo pubblico, generato dall'export, la directory
      # tools/release/policy/ non c'e' e il passo si salta invece di fallire per un file assente.
      - name: Cancello parziale (senza DB) — solo nel repo di lavoro
        if: hashFiles('tools/release/policy/ALLOWLIST.txt') != ''
        run: python tools/release/cancello_hook.py --fase ci

  desktop-windows:
    runs-on: windows-latest
    # 06/10 (PM): sul privato i minuti Actions sono a pagamento oltre i 2000 gratuiti: qui gira solo a
    # comando; sul pubblico (gratis) a ogni push e PR, come prima.
    if: ${{ github.event.repository.private == false || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install and test desktop bundles with a synthetic backend
        working-directory: app
        run: |
          npm ci
          npm run desktop:install
          npm run build:bundles
          npm run test:release
          npm run test:desktop
      - name: Build Windows installer (external Python backend)
        working-directory: app
        run: npx electron-builder --win nsis --publish never

  # 12/09 (mandato Fable, sez. 4 — ricognizione recon/mac.md §5.1): il percorso «clono e
  # avvio» su macOS non era mai stato eseguito da nessuno. Questo job lo misura su Apple
  # Silicon (macos-latest = macOS 26 arm64, doc actions/runner-images letta il 12/09):
  #   - pip install -e . risolve i wheel arm64 (onnxruntime, dipendenza di chromadb, e' il
  #     nodo duro: solo macosx_14_0_arm64, nessun wheel Intel — recon A1);
  #   - la suite offline passa su POSIX/APFS (3 test saltano con motivo dichiarato);
  #   - tsc + vite build con i binding darwin del lockfile; Electron parte headless con
  #     preload/CSP corretti contro un backend SINTETICO (test:desktop non spawna Python).
  # Cosa NON dimostra: l'avvio del backend vero dall'app, la finestra reale, i font dei PDF,
  # Intel, Python 3.14, un pacchetto DMG (non firmabile senza identita' Apple).
  # COSTO (doc GitHub billing, letta il 12/09): Actions gratuite sui repo pubblici con runner
  # standard; sui privati macOS costa $0.062/min contro $0.006 Linux (~10x). Il job gira
  # quindi sul repo pubblico e, sul privato, SOLO a comando (Actions → CI → Run workflow).
  macos-source:
    runs-on: macos-latest
    if: ${{ github.event.repository.private == false || github.event_name == 'workflow_dispatch' }}
    env:
      ANTHROPIC_API_KEY: dummy-ci-offline
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Dipendenze Python (wheel arm64)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pip check

      - name: Compile package and operational tools
        run: >
          python -m compileall -q src/bellomberg tools/ops tools/migrations
          bellomberg_api.py consigliere_multi.py price_updater.py
          briefing_engine.py regenerate_memo.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The Python integration suite also exercises the real React valuation UI.
      - name: Frontend dependencies for integration tests
        working-directory: app
        run: npm ci

      - name: Suite offline (POSIX, APFS)
        run: python -I tools/testing/research_ci.py

      - name: Frontend production bundles and release contracts
        working-directory: app
        run: |
          npm run build:bundles
          npm run test:release

      - name: Electron smoke (renderer/preload/CSP against a synthetic backend)
        working-directory: app
        run: |
          npm run desktop:install
          npm run test:desktop

  # 05/10 (decisione PM): la suite INTERA su Linux. Il job `test` esegue solo l'elenco esplicito
  # di tools/testing/research_ci.py (~38 file su ~714): i test node/React dentro la suite Python
  # in CI non giravano mai. Qui `pytest tests/` completo sul checkout pulito (niente DB, niente
  # .env: conftest.py mette la chiave fittizia, blocca la rete e la spia delle scritture).
  # `npm ci` PRIMA di pytest: i test node/React della suite Python leggono app/node_modules (la
  # chat backend li sta facendo FALLIRE, non saltare, se manca). Durata stimata 45-60 min (test_trade_idea_no_workbook_e2e ~32 min sotto carico).
  # QUANDO: push su main e a comando, mai sulle pull_request (il feedback delle PR resta quello
  # dei job veloci). COSTO: Linux gratuito sui repo pubblici; sul privato (minuti limitati) gira
  # SOLO a comando (Actions -> CI -> Run workflow), stessa regola del job macos-source.
  suite-linux:
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' && github.event.repository.private == false) || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 120  # 11/10: 19.3k test, la run 38089968771 era al 96% a 90 min
    permissions:
      contents: read
    concurrency:
      group: suite-linux-${{ github.ref }}
      cancel-in-progress: true
    env:
      ANTHROPIC_API_KEY: dummy-ci-offline
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend dependencies for the node tests inside the Python suite
        working-directory: app
        run: npm ci

      - name: Suite intera (pytest tests/)
        run: python -m pytest tests/ -q -rfE -p no:cacheprovider --durations=25
